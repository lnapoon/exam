<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" width="100%" height="auto">
  <rect width="1080" height="452" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 8: ประเภทของดาวเทียมจำแนกตามระดับวงโคจร 4 ประเภท (LEO, MEO, GEO, HEO)</text>
  <rect x="24" y="56" width="424" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="212" cy="252" r="34" fill="#2563eb"/>
  <text x="212" y="258" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#ffffff">โลก</text>
  <circle cx="212" cy="252" r="66" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="5,5"/>
  <text x="212" y="180" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#15803d">LEO</text>
  <circle cx="212" cy="252" r="106" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="5,5"/>
  <text x="212" y="140" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#1d4ed8">MEO (GPS)</text>
  <circle cx="212" cy="252" r="150" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="5,5"/>
  <text x="212" y="96" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#7c3aed">GEO (22,300 ไมล์)</text>
  <ellipse cx="246" cy="236" rx="164" ry="74" transform="rotate(-18 246 236)" fill="none" stroke="#dc2626" stroke-width="2.4"/>
  <text x="384" y="152" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#dc2626">HEO (วงรี)</text>
  <rect x="468" y="56" width="588" height="376" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="488" y="86" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">สรุประยะความสูงและจุดเด่นทั้ง 4 วงโคจร (ต้องจำตัวเลข!)</text>
  <rect x="488" y="102" width="548" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="506" y="126" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#14532d">1. LEO (Low Earth Orbit): สูง 100 – 1,000 ไมล์</text>
  <text x="506" y="152" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">ใกล้โลกที่สุด ความหน่วงต่ำ ใช้สำรวจทรัพยากร ภูมิอากาศ โทรศัพท์มือถือดาวเทียม</text>
  <rect x="488" y="182" width="548" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="506" y="206" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e3a8a">2. MEO (Medium Earth Orbit): สูง 1,000 – 22,300 ไมล์</text>
  <text x="506" y="232" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">ใช้ในระบบบอกพิกัดตำแหน่งบนพื้นโลก (GPS) และการสื่อสารเฉพาะพื้นที่</text>
  <rect x="488" y="262" width="548" height="82" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="506" y="286" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">3. GEO (Geosynchronous Earth Orbit): สูง 22,300 ไมล์ เหนือเส้นศูนย์สูตร</text>
  <text x="506" y="310" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="bold" fill="#dc2626">โคจรเร็วเท่าโลกหมุน 1 ดวงคลุม 1/3 ของโลก → ใช้ 3 ดวง (ห่างกัน 120°) คลุมทั่วโลก</text>
  <text x="506" y="332" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">ตัวอย่าง: ดาวเทียมสื่อสารโทรทัศน์ / ดาวเทียมไทยคม</text>
  <rect x="488" y="354" width="548" height="66" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="506" y="378" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#991b1b">4. HEO (Highly Elliptical Orbit): วงโคจรรูปวงรี</text>
  <text x="506" y="402" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">มีจุดใกล้และไกลโลก ใช้ในภารกิจสอดแนมทางทหารของมหาอำนาจและวิทยาศาสตร์</text>
</svg>