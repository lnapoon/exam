<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" height="auto">
  <rect width="1080" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 7.7 และ 7.8: โครงสร้างสายโคแอ็กเชียล (Coaxial Cable) และคอนเน็กเตอร์ตระกูล BNC</text>
  <rect x="24" y="56" width="514" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="86" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">รูปที่ 7.7: โครงสร้างสายโคแอ็กเชียล 4 ชั้น (ด้านนอก → แกนใน)</text>
  <rect x="48"  y="112" width="108" height="72" fill="#334155" rx="4"/>
  <rect x="156" y="122" width="96"  height="52" fill="#94a3b8"/>
  <rect x="252" y="132" width="96"  height="32" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <line x1="348" y1="148" x2="492" y2="148" stroke="#d97706" stroke-width="10"/>
  <text x="102" y="204" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#0f172a">1. ปลอกนอก</text>
  <text x="204" y="204" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#0f172a">2. ตาข่ายโลหะ</text>
  <text x="300" y="204" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#0f172a">3. ฉนวนไฟฟ้า</text>
  <text x="420" y="204" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#d97706">4. แกนทองแดง</text>
  <rect x="44" y="224" width="474" height="116" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="62" y="248" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#92400e">มาตรฐาน RG (Radio Government) ที่ออกสอบ:</text>
  <text x="62" y="272" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• RG-59 (ความต้านทาน 75 Ω) → ใช้กับระบบเคเบิลทีวี (CATV)</text>
  <text x="62" y="294" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• RG-58 (ความต้านทาน 50 Ω) → ใช้กับ Thin Ethernet (10Base2)</text>
  <text x="62" y="316" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• RG-11 (ความต้านทาน 50 Ω) → ใช้กับ Thick Ethernet (10Base5)</text>
  <rect x="558" y="56" width="498" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="578" y="86" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">รูปที่ 7.8: คอนเน็กเตอร์ตระกูล BNC ทั้ง 3 รูปแบบ</text>
  <rect x="578" y="108" width="458" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="596" y="134" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e3a8a">1. BNC Connector (หัวเชื่อมต่อสายโคแอ็กเชียล)</text>
  <text x="596" y="160" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">ใช้เข้าหัวที่ปลายสายเคเบิลเพื่อเชื่อมต่อกับอุปกรณ์ เช่น ทีวี หรือเครื่องรับ</text>
  <rect x="578" y="192" width="458" height="72" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="596" y="218" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">2. BNC-T Connector (หัวต่อรูปตัว T สามทาง)</text>
  <text x="596" y="244" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">ใช้ในเครือข่าย Ethernet แบบ Bus เพื่อแยกสัญญาณจากสายหลักเข้าสู่การ์ดแลน</text>
  <rect x="578" y="276" width="458" height="72" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="596" y="302" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#991b1b">3. BNC Terminator (หัวปิดปลายสาย)</text>
  <text x="596" y="328" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">ปิดที่ปลายทั้ง 2 ข้างของสาย Bus เพื่อดูดซับสัญญาณป้องกันการสะท้อนกลับ</text>
</svg>