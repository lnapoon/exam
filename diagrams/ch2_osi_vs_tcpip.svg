<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="100%" height="auto">
  <rect width="1080" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 2: เปรียบเทียบ Internet Model (TCP/IP 5 เลเยอร์) กับ OSI Model (ISO 7 เลเยอร์)</text>
  <text x="160" y="74" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">Internet Model (5 ชั้น)</text>
  <text x="505" y="74" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">OSI Model (7 ชั้น)</text>
  <text x="875" y="74" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">การจัดกลุ่มเลเยอร์ &amp; หน่วยข้อมูล (PDU)</text>
  <rect x="28" y="90" width="264" height="158" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="160" y="162" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#5b21b6">5. Application Layer</text>
  <text x="160" y="184" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">(รวมหน้าที่ชั้น 5, 6, 7 ของ OSI)</text>
  <rect x="322" y="90" width="366" height="46" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="505" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#0f172a">7. Application (บริการผู้ใช้ / HTTP / FTP / SMTP)</text>
  <rect x="322" y="146" width="366" height="46" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="505" y="174" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#0f172a">6. Presentation (แปลรหัส / เข้ารหัส / บีบอัดข้อมูล)</text>
  <rect x="322" y="202" width="366" height="46" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="505" y="230" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#0f172a">5. Session (ควบคุมจังหวะ Dialog / Checkpoint)</text>
  <rect x="714" y="90" width="338" height="158" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="883" y="140" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#5b21b6">กลุ่ม User Support Layers (ชั้น 5, 6, 7)</text>
  <text x="883" y="166" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="normal" fill="#475569">ดูแลด้านซอฟต์แวร์ประยุกต์ให้ทำงานร่วมกันได้</text>
  <text x="883" y="198" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13.5" font-weight="bold" fill="#0f172a">หน่วยข้อมูล: Message / Data</text>
  <rect x="28" y="262" width="264" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="160" y="293" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">4. Transport Layer</text>
  <rect x="322" y="262" width="366" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="505" y="293" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#0f172a">4. Transport (Process-to-Process / Port)</text>
  <rect x="714" y="262" width="338" height="52" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="883" y="284" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#92400e">ตัวเชื่อมโยง (Transport — ชั้น 4)</text>
  <text x="883" y="304" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">เชื่อม User Support ↔ Network Support (Segment)</text>
  <rect x="28" y="328" width="264" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="160" y="358" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#1e3a8a">3. Network Layer</text>
  <rect x="322" y="328" width="366" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="505" y="358" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#0f172a">3. Network (Source-to-Dest / IP / Routing)</text>
  <rect x="28" y="388" width="264" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="160" y="418" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#14532d">2. Data Link Layer</text>
  <rect x="322" y="388" width="366" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="505" y="418" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#0f172a">2. Data Link (Hop-to-Hop / MAC / Frame)</text>
  <rect x="28" y="448" width="264" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="160" y="478" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#991b1b">1. Physical Layer</text>
  <rect x="322" y="448" width="366" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="505" y="478" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#0f172a">1. Physical (ส่งบิต 0/1 ผ่านสื่อสัญญาณ)</text>
  <rect x="714" y="328" width="338" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="883" y="376" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#1e3a8a">กลุ่ม Network Support Layers (ชั้น 1, 2, 3)</text>
  <text x="883" y="402" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="normal" fill="#475569">จัดการด้านกายภาพและส่งข้อมูลข้ามเครือข่าย</text>
  <text x="883" y="434" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">L3: Packet | L2: Frame | L1: Bits</text>
  <text x="883" y="464" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#dc2626">อุปกรณ์ Router ทำงานเฉพาะชั้น 1–3 เท่านั้น</text>
</svg>