<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" width="100%" height="auto">
  <rect width="1080" height="452" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 2.12, ตัวอย่างที่ 3 (รูปที่ 2.14) และรูปที่ 2.15: Transport Segmentation (พอร์ต j → k) &amp; Application Layer</text>
  <rect x="24" y="56" width="476" height="376" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="44" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e3a8a">เครื่องต้นทาง A (แบ่ง Data เป็น 2 เซ็กเมนต์ + ใส่พอร์ต j → k)</text>
  <rect x="44" y="102" width="436" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="262" y="129" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#5b21b6">5. Application (HTTP/FTP/SMTP): ส่ง Message = [ Data ]</text>
  <line x1="262.0" y1="146.0" x2="262.0" y2="160.0" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="262.0,168.0 256.5,158.0 267.5,158.0" fill="#7c3aed"/>
  <rect x="44" y="170" width="436" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="262" y="192" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.4" font-weight="bold" fill="#92400e">4. Transport: แบ่งเป็น 2 Segments + ใส่ Port (Src=j, Dst=k)</text>
  <text x="262" y="218" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#0f172a">[Data-1 | j | k]        และ        [Data-2 | j | k]</text>
  <line x1="262.0" y1="232.0" x2="262.0" y2="246.0" stroke="#d97706" stroke-width="2.4"/>
  <polygon points="262.0,254.0 256.5,244.0 267.5,244.0" fill="#d97706"/>
  <rect x="44" y="256" width="436" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="262" y="278" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.4" font-weight="bold" fill="#1e3a8a">3. Network: เติม Logical/IP Address (A → P)</text>
  <text x="262" y="304" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.2" font-weight="bold" fill="#1d4ed8">[Data-1 | j | k | A | P]    [Data-2 | j | k | A | P]</text>
  <line x1="262.0" y1="318.0" x2="262.0" y2="332.0" stroke="#2563eb" stroke-width="2.4"/>
  <polygon points="262.0,340.0 256.5,330.0 267.5,330.0" fill="#2563eb"/>
  <rect x="44" y="342" width="436" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="262" y="366" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.4" font-weight="bold" fill="#14532d">2. Data Link: เติม MAC (12) + Trailer (T2) ก่อนส่งออก</text>
  <text x="262" y="388" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.2" font-weight="bold" fill="#0f172a">[T2 | Data-1 | j | k | A | P | 12]</text>
  <text x="262" y="406" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.2" font-weight="bold" fill="#0f172a">[T2 | Data-2 | j | k | A | P | 12]</text>
  <line x1="502.0" y1="260.0" x2="570.0" y2="260.0" stroke="#2563eb" stroke-width="3.5"/>
  <polygon points="578.0,260.0 568.0,265.5 568.0,254.5" fill="#2563eb"/>
  <text x="540" y="246" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#1d4ed8">Internet</text>
  <text x="540" y="286" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.5" font-weight="normal" fill="#475569">(อาจไปคนละ</text>
  <text x="540" y="302" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.5" font-weight="normal" fill="#475569">เส้นทางได้)</text>
  <rect x="580" y="56" width="476" height="376" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="600" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#14532d">เครื่องปลายทาง P (ถอด Header &amp; ประกอบ Data-1 + Data-2 กลับ)</text>
  <rect x="600" y="102" width="436" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="818" y="126" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.4" font-weight="bold" fill="#5b21b6">5. Application Layer (รูปที่ 2.15): โพรเซสพอร์ต k ได้รับ [Data]</text>
  <text x="818" y="146" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">บริการหลัก: Mail (SMTP) | ไฟล์ (FTP) | ระยะไกล (Telnet) | เว็บ (HTTP)</text>
  <line x1="818.0" y1="184.0" x2="818.0" y2="168.0" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="818.0,160.0 823.5,170.0 812.5,170.0" fill="#7c3aed"/>
  <rect x="600" y="186" width="436" height="68" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="818" y="210" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.4" font-weight="bold" fill="#92400e">4. Transport (Reassembly): ถอดพอร์ต (j, k) และเรียงลำดับ</text>
  <text x="818" y="236" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.6" font-weight="bold" fill="#0f172a">นำ [Data-1] + [Data-2] ประกอบรวมกลับเป็น [ Data ] สมบูรณ์!</text>
  <line x1="818.0" y1="280.0" x2="818.0" y2="264.0" stroke="#d97706" stroke-width="2.4"/>
  <polygon points="818.0,256.0 823.5,266.0 812.5,266.0" fill="#d97706"/>
  <rect x="600" y="282" width="436" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="818" y="314" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.6" font-weight="bold" fill="#1e3a8a">3. Network: ตรวจสอบ IP ปลายทาง = P แล้วถอด H3 ออก</text>
  <line x1="818.0" y1="362.0" x2="818.0" y2="346.0" stroke="#2563eb" stroke-width="2.4"/>
  <polygon points="818.0,338.0 823.5,348.0 812.5,348.0" fill="#2563eb"/>
  <rect x="600" y="364" width="436" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="818" y="394" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.6" font-weight="bold" fill="#1e3a8a">2. Data Link &amp; 1. Physical: ตรวจ T2 → ถอด H2/T2 ส่งขึ้นบน</text>
</svg>