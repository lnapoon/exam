<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" height="auto">
  <rect width="1080" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 7: โหมดการส่งแสงผ่านสายไฟเบอร์ออปติกทั้ง 3 แบบ (Propagation Modes)</text>
  <rect x="24" y="56" width="1032" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">1) Multimode Step-Index (ความหนาแน่นของแกน Core คงที่)</text>
  <text x="44" y="110" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ลำแสงหลายลำเดินทางเป็นเส้นตรงแล้วหักเหฉับพลันที่รอยต่อ Core/Cladding</text>
  <text x="44" y="131" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ลำแสงถึงปลายทางไม่พร้อมกัน ทำให้สัญญาณบิดเบี้ยวสูง (Modal Dispersion)</text>
  <rect x="640" y="72" width="396" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <path d="M 652 108 L 732 78 L 832 138 L 932 78 L 1024 108" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 652 108 L 772 138 L 902 78 L 1024 108" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="652" y1="108" x2="1024" y2="108" stroke="#2563eb" stroke-width="2.2"/>
  <rect x="24" y="176" width="1032" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="204" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">2) Multimode Graded-Index (ความหนาแน่นสูงสุดที่ศูนย์กลาง ลดลงที่ขอบ)</text>
  <text x="44" y="230" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ลำแสงถูกบังคับให้โค้งกลับเข้าสู่ศูนย์กลางเป็นลูกคลื่น ลดความเพี้ยนของสัญญาณได้ดี</text>
  <text x="44" y="251" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ขนาดมาตรฐานที่นิยม: 50/125 μm, 62.5/125 μm (นิยมสูงสุด), 100/125 μm</text>
  <rect x="640" y="192" width="396" height="72" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <path d="M 652 228 Q 745 186 838 228 T 1024 228" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 652 228 Q 745 270 838 228 T 1024 228" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="652" y1="228" x2="1024" y2="228" stroke="#2563eb" stroke-width="2.2"/>
  <rect x="24" y="296" width="1032" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="324" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">3) Single-Mode Fiber (SMF — แกน Core ขนาดเล็กมาก ~7–9/125 μm)</text>
  <text x="44" y="350" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ใช้แหล่งกำเนิดแสงเลเซอร์ความเข้มข้นสูง บังคับให้ลำแสงเดินทางเป็นเส้นตรงเพียงลำเดียว</text>
  <text x="44" y="371" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• สัญญาณแทบไม่บิดเบี้ยวเลย ส่งข้อมูลได้เร็วที่สุดและไกลที่สุดในบรรดาสายทุกชนิด</text>
  <rect x="640" y="312" width="396" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <rect x="640" y="338" width="396" height="20" fill="#bbf7d0"/>
  <line x1="654.0" y1="348.0" x2="1012.0" y2="348.0" stroke="#dc2626" stroke-width="3"/>
  <polygon points="1020.0,348.0 1010.0,353.5 1010.0,342.5" fill="#dc2626"/>
</svg>