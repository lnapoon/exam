  <rect x="628" y="100" width="408" height="152" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="646" y="126" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">การตรวจสอบที่ฝั่งผู้รับ (รูปที่ 10.9):</text>
  <text x="646" y="152" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• นำข้อมูลพร้อม CRC (100100001)</text>
  <text x="646" y="174" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">มาหารยาวด้วยตัวหารตัวเดิมคือ 1101</text>
  <text x="646" y="196" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• เศษเหลือ = 000 → ข้อมูลถูกต้อง (Accept) แล้วตัด 3 บิตท้ายออก</text>
  <text x="646" y="218" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">เหลือข้อมูลจริง 100100</text>
  <text x="646" y="240" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• เศษเหลือ ≠ 000 → ข้อมูลผิดพลาด (Reject)</text>
  <rect x="628" y="266" width="408" height="134" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="646" y="292" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.2" font-weight="bold" fill="#5b21b6">การเขียนตัวหารรูปโพลิโนเมียล (รูปที่ 10.10–10.11):</text>
  <text x="646" y="322" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">10100111 (8 บิต)  →  x^7 + x^5 + x^2 + x + 1</text>
  <text x="646" y="348" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• ดีกรีสูงสุด = 7 → บิต CRC ยาว 7 บิต (ตัวหารยาว 8 บิต)</text>
  <text x="646" y="369" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• ต้องหารด้วย x ไม่ลงตัว (ต้องลงท้ายด้วย +1 เสมอ)</text>
  <rect x="628" y="414" width="408" height="114" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="646" y="438" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.2" font-weight="bold" fill="#92400e">มาตรฐานโพลิโนเมียล (ตารางที่ 10.1):</text>
  <text x="646" y="462" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="12.4" font-weight="bold" fill="#1e293b">• CRC-8: ATM header   |  • CRC-10: ATM AAL</text>
  <text x="646" y="485" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="12.4" font-weight="bold" fill="#1e293b">• ITU-16: HDLC        |  • ITU-32: LANs</text>
  <text x="646" y="508" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="12.4" font-weight="bold" fill="#1e293b">(Ethernet)</text>
