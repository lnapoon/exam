  <text x="306" y="508" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="14" font-weight="bold" fill="#1e3a8a">ข้อมูลที่ส่งออกจริง (Data + CRC) = 100100001</text>
