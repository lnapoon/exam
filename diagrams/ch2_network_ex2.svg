<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 488" width="100%" height="auto">
  <rect width="1080" height="488" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">ตัวอย่างที่ 2 (รูปที่ 2.11): การส่งข้อมูลข้ามเครือข่าย 3 Hop (IP คงเดิมตลอดทาง / MAC เปลี่ยนทุก Hop!)</text>
  <rect x="24" y="56" width="1032" height="412" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="175" y="84" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e40af">เครือข่ายที่ 1 (Bus แรก)</text>
  <text x="540" y="84" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#7c3aed">เครือข่ายที่ 2 (Ring กลาง)</text>
  <text x="905" y="84" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#15803d">เครือข่ายที่ 3 (Bus สุดท้าย)</text>
  <rect x="44" y="118" width="128" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="108" y="144" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#1e3a8a">โหนดต้นทาง</text>
  <text x="108" y="168" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13.5" font-weight="bold" fill="#2563eb">IP: A</text>
  <text x="108" y="190" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#15803d">MAC: 10</text>
  <rect x="284" y="108" width="174" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="371" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">Router 1</text>
  <text x="371" y="162" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#0f172a">ซ้าย: IP=F, MAC=20</text>
  <text x="371" y="186" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#0f172a">ขวา:  IP=T, MAC=99</text>
  <rect x="622" y="108" width="174" height="106" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="709" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">Router 2</text>
  <text x="709" y="162" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#0f172a">ซ้าย: IP=N, MAC=33</text>
  <text x="709" y="186" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#0f172a">ขวา:  IP=Z, MAC=66</text>
  <rect x="908" y="118" width="128" height="86" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="972" y="144" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#14532d">โหนดปลายทาง</text>
  <text x="972" y="168" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13.5" font-weight="bold" fill="#2563eb">IP: P</text>
  <text x="972" y="190" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#15803d">MAC: 95</text>
  <line x1="174.0" y1="161.0" x2="274.0" y2="161.0" stroke="#2563eb" stroke-width="3"/>
  <polygon points="282.0,161.0 272.0,166.5 272.0,155.5" fill="#2563eb"/>
  <line x1="460.0" y1="161.0" x2="612.0" y2="161.0" stroke="#7c3aed" stroke-width="3"/>
  <polygon points="620.0,161.0 610.0,166.5 610.0,155.5" fill="#7c3aed"/>
  <line x1="798.0" y1="161.0" x2="898.0" y2="161.0" stroke="#16a34a" stroke-width="3"/>
  <polygon points="906.0,161.0 896.0,166.5 896.0,155.5" fill="#16a34a"/>
  <rect x="44" y="240" width="314" height="132" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="201" y="266" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e3a8a">ทอดที่ 1 (Hop 1: โหนด A → R1)</text>
  <text x="62" y="294" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#2563eb">Logical (IP):  A → P  (ไม่เปลี่ยน)</text>
  <text x="62" y="318" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#dc2626">Physical (MAC): 10 → 20</text>
  <rect x="62" y="330" width="278" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="201" y="350" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.5" font-weight="bold" fill="#0f172a">[T2 | Data | A | P | 10 | 20]</text>
  <rect x="383" y="240" width="314" height="132" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="540" y="266" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">ทอดที่ 2 (Hop 2: R1 → R2)</text>
  <text x="401" y="294" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#2563eb">Logical (IP):  A → P  (ไม่เปลี่ยน)</text>
  <text x="401" y="318" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#dc2626">Physical (MAC): 99 → 33 (เปลี่ยน!)</text>
  <rect x="401" y="330" width="278" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="350" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.5" font-weight="bold" fill="#0f172a">[T2 | Data | A | P | 99 | 33]</text>
  <rect x="722" y="240" width="314" height="132" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="879" y="266" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#14532d">ทอดที่ 3 (Hop 3: R2 → โหนด P)</text>
  <text x="740" y="294" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#2563eb">Logical (IP):  A → P  (ไม่เปลี่ยน)</text>
  <text x="740" y="318" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#dc2626">Physical (MAC): 66 → 95 (เปลี่ยน!)</text>
  <rect x="740" y="330" width="278" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="879" y="350" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.5" font-weight="bold" fill="#0f172a">[T2 | Data | A | P | 66 | 95]</text>
  <rect x="44" y="392" width="992" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="540" y="425" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.2" font-weight="bold" fill="#991b1b">กฎเหล็กออกสอบ (ตัวอย่างที่ 2): Logical/IP Address (A → P) ไม่เคยเปลี่ยนค่าตลอดเส้นทาง แต่ Physical/MAC Address เปลี่ยนใหม่ทุกครั้งที่ผ่าน Router!</text>
</svg>