  <text x="188" y="318" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">สัญญาณแสงรั่วไหล ไม่สามารถส่งต่อในสายได้</text>
  <rect x="376" y="56" width="328" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="86" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">กรณีที่ 2: มุม I = มุมวิกฤติ</text>
  <rect x="396" y="104" width="288" height="74" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
