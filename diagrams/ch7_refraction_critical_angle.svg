<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" height="auto">
  <rect width="1080" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 7: หลักการทางแสง — การหักเห (Refraction) และมุมวิกฤติ (Critical Angle)</text>
  <rect x="24" y="56" width="328" height="304" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
