  <rect x="748" y="104" width="288" height="74" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="748" y="178" width="288" height="82" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="892" y1="104" x2="892" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="756" y="124" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#64748b">Cladding (หนาแน่นน้อย)</text>
  <text x="756" y="252" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#1e3a8a">Core (หนาแน่นมาก)</text>
  <line x1="784.0" y1="240.0" x2="885.1" y2="182.0" stroke="#16a34a" stroke-width="3"/>
  <polygon points="892.0,178.0 886.1,187.7 880.6,178.2" fill="#16a34a"/>
  <line x1="892.0" y1="178.0" x2="993.1" y2="236.0" stroke="#16a34a" stroke-width="3"/>
  <polygon points="1000.0,240.0 988.6,239.8 994.1,230.3" fill="#16a34a"/>
  <text x="892" y="294" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.2" font-weight="bold" fill="#0f172a">เกิดการสะท้อนกลับหมด (Total Reflection)</text>
  <text x="892" y="318" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">ลำแสงสะท้อนซิกแซกอยู่ในแกน Core ตลอดสาย</text>
</svg>