  <line x1="540" y1="104" x2="540" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="404" y="124" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#64748b">Cladding (หนาแน่นน้อย)</text>
  <text x="404" y="252" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#1e3a8a">Core (หนาแน่นมาก)</text>
  <line x1="464.0" y1="250.0" x2="534.2" y2="183.5" stroke="#7c3aed" stroke-width="2.8"/>
  <polygon points="540.0,178.0 536.5,188.9 529.0,180.9" fill="#7c3aed"/>
  <line x1="540.0" y1="178.0" x2="660.0" y2="178.0" stroke="#7c3aed" stroke-width="2.8"/>
  <polygon points="668.0,178.0 658.0,183.5 658.0,172.5" fill="#7c3aed"/>
  <text x="540" y="294" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.2" font-weight="bold" fill="#0f172a">แสงหักเหทำมุม 90° เลียบผิวรอยต่อ</text>
  <text x="540" y="318" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">เป็นจุดแบ่งเขตระหว่างการหักเหกับการสะท้อน</text>
  <rect x="728" y="56" width="328" height="304" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
