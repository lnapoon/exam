  <rect x="44" y="104" width="288" height="74" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="44" y="178" width="288" height="82" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="188" y1="104" x2="188" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="52" y="124" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#64748b">Cladding (หนาแน่นน้อย)</text>
  <text x="52" y="252" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#1e3a8a">Core (หนาแน่นมาก)</text>
  <line x1="136.0" y1="250.0" x2="183.3" y2="184.5" stroke="#dc2626" stroke-width="2.8"/>
