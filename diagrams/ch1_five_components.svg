<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 312" width="100%" height="auto">
  <rect width="1080" height="312" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 1.1: องค์ประกอบของการสื่อสารข้อมูล 5 อย่าง (Five Components of Data Communication)</text>
  <rect x="24" y="56" width="1032" height="236" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="48" y="80" width="210" height="52" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="153" y="102" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">5. Protocol (กฎเกณฑ์)</text>
  <text x="153" y="122" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#64748b">Step 1, Step 2, Step 3, ...</text>
  <rect x="822" y="80" width="210" height="52" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="927" y="102" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">5. Protocol (กฎเกณฑ์)</text>
  <text x="927" y="122" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#64748b">Step 1, Step 2, Step 3, ...</text>
  <line x1="268.0" y1="106.0" x2="812.0" y2="106.0" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="6,5"/>
  <polygon points="820.0,106.0 810.0,111.5 810.0,100.5" fill="#7c3aed"/>
  <polygon points="260.0,106.0 270.0,100.5 270.0,111.5" fill="#7c3aed"/>
  <text x="540" y="96" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#7c3aed">ข้อตกลงร่วมกันระหว่างผู้ส่งและผู้รับ (หากไม่มี Protocol จะสื่อสารไม่เข้าใจกัน)</text>
  <rect x="48" y="154" width="210" height="82" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="153" y="184" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e3a8a">2. ผู้ส่ง (Sender)</text>
  <text x="153" y="206" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">คอมพิวเตอร์ / เวิร์กสเตชัน</text>
  <text x="153" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">โทรศัพท์ / กล้องวิดีโอ</text>
  <rect x="822" y="154" width="210" height="82" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="927" y="184" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#14532d">3. ผู้รับ (Receiver)</text>
  <text x="927" y="206" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">คอมพิวเตอร์ / เครื่องพิมพ์</text>
  <text x="927" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">โทรทัศน์ / โทรศัพท์</text>
  <rect x="376" y="124" width="328" height="54" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="540" y="146" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">1. ข่าวสาร (Message)</text>
  <text x="540" y="166" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#78350f">ข้อความ, ตัวเลข, รูปภาพ, เสียง, วิดีโอ</text>
  <line x1="262.0" y1="200.0" x2="810.0" y2="200.0" stroke="#2563eb" stroke-width="3.2"/>
  <polygon points="818.0,200.0 808.0,205.5 808.0,194.5" fill="#2563eb"/>
  <text x="540" y="228" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#1d4ed8">4. สื่อกลาง (Transmission Medium): สายคู่บิดเกลียว / สายโคแอกซ์ / ไฟเบอร์ออปติก / คลื่นวิทยุ</text>
  <text x="540" y="272" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#0f172a">คุณสมบัติพื้นฐาน 3 ประการของการสื่อสารข้อมูลที่ดี: 1) การส่งมอบ (Delivery)  2) ความถูกต้องแม่นยำ (Accuracy)  3) ทันเวลา (Timeliness)</text>
</svg>