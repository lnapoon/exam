  <text x="892" y="86" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#92400e">รูปที่ 7.21 (ข): Horn Antenna (ปากแตร)</text>
  <text x="892" y="108" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">(ไมโครเวฟ Unidirectional — แนวเล็ง)</text>
  <path d="M 800 250 L 800 182 Q 800 144 854 136 L 914 128 L 914 212 L 854 202 Q 832 198 832 250 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
