<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 396" width="100%" height="auto">
  <rect width="1080" height="396" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 7.20 และ 7.21: ภาพวาดเสาอากาศคลื่นวิทยุ (Omnidirectional) และเสาไมโครเวฟ (Dish &amp; Horn)</text>
