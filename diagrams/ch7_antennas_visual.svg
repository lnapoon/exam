  <text x="540" y="108" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">(จานพาราโบลา — ไมโครเวฟ Unidirectional)</text>
