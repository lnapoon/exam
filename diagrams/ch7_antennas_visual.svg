  <text x="188" y="108" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">(ใช้กับคลื่นวิทยุ Radio Wave)</text>
  <circle cx="188" cy="186" r="24" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="188" cy="186" r="44" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="188" cy="186" r="64" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="188" y1="262" x2="188" y2="186" stroke="#0f172a" stroke-width="4"/>
  <circle cx="188" cy="186" r="6" fill="#dc2626"/>
  <text x="44" y="286" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• แพร่กระจายคลื่นออกทุกทิศทาง (360°)</text>
  <text x="44" y="307" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• ทะลุผ่านผนัง/อาคารได้ดี เหมาะกับ Multicast</text>
