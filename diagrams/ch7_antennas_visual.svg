  <text x="748" y="307" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">บีบคลื่นไมโครเวฟให้พุ่งออกเป็นลำแคบตรงทิศทางเดียว</text>
