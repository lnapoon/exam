  <text x="396" y="286" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">• ลำคลื่นขนานตกกระทบจานโค้งแล้วรวมเข้าสู่จุด</text>
  <text x="396" y="307" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.4" font-weight="normal" fill="#1e293b">  โฟกัสเดียว (ส่งพุ่งตรงทิศทางเดียว)</text>
