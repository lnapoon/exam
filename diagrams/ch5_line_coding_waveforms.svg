<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 596" width="100%" height="auto">
  <rect width="1080" height="596" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 5: กราฟเปรียบเทียบการเข้ารหัสสัญญาณดิจิทัล Line Coding ทั้ง 7 วิธี (ข้อมูล: 0  1  0  0  1  1)</text>
  <line x1="310" y1="54" x2="310" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="430" y1="54" x2="430" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="550" y1="54" x2="550" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="670" y1="54" x2="670" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="790" y1="54" x2="790" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="910" y1="54" x2="910" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="1030" y1="54" x2="1030" y2="574" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="370" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#2563eb">0</text>
  <text x="490" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#dc2626">1</text>
  <text x="610" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#2563eb">0</text>
  <text x="730" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#2563eb">0</text>
  <text x="850" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#dc2626">1</text>
  <text x="970" y="74" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="18" font-weight="bold" fill="#dc2626">1</text>
  <text x="28" y="114" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">1. Unipolar (ขั้วเดียว)</text>
  <text x="28" y="133" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">0 = 0V, 1 = +V</text>
  <line x1="310" y1="118" x2="1030" y2="118" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 118 L 430 118 L 430 92 L 550 92 L 550 118 L 790 118 L 790 92 L 1030 92" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="28" y="184" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">2. Polar NRZ-L (Level)</text>
  <text x="28" y="203" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">0 = +V, 1 = -V</text>
  <line x1="310" y1="188" x2="1030" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 166 L 430 166 L 430 210 L 550 210 L 550 166 L 790 166 L 790 210 L 1030 210" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="28" y="254" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">3. Polar NRZ-I (Invert on 1)</text>
  <text x="28" y="273" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">บิต 1 = เปลี่ยนระดับ, 0 = คงเดิม</text>
  <line x1="310" y1="258" x2="1030" y2="258" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 236 L 430 236 L 430 280 L 790 280 L 790 236 L 910 236 L 910 280 L 1030 280" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="28" y="324" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">4. Polar RZ (Return to Zero)</text>
  <text x="28" y="343" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">0 = -V→0, 1 = +V→0 (3 ระดับ)</text>
  <line x1="310" y1="328" x2="1030" y2="328" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 350 L 370 350 L 370 328 L 430 328 L 430 306 L 490 306 L 490 328 L 550 328 L 550 350 L 610 350 L 610 328 L 670 328 L 670 350 L 730 350 L 730 328 L 790 328 L 790 306 L 850 306 L 850 328 L 910 328 L 910 306 L 970 306 L 970 328 L 1030 328" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="28" y="398" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">5. Manchester (ซิงโครไนซ์ในตัว)</text>
  <text x="28" y="417" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">กลางบิต: 0 = ลง (↓), 1 = ขึ้น (↑)</text>
  <line x1="310" y1="402" x2="1030" y2="402" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 380 L 370 380 L 370 424 L 490 424 L 490 380 L 610 380 L 610 424 L 670 424 L 670 380 L 730 380 L 730 424 L 850 424 L 850 380 L 910 380 L 910 424 L 970 424 L 970 380 L 1030 380" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="28" y="472" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">6. Differential Manchester</text>
  <text x="28" y="491" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">ต้นบิต: 0 = เปลี่ยน, 1 = ไม่เปลี่ยน</text>
  <line x1="310" y1="476" x2="1030" y2="476" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 498 L 370 498 L 370 454 L 490 454 L 490 498 L 550 498 L 550 454 L 610 454 L 610 498 L 670 498 L 670 454 L 730 454 L 730 498 L 850 498 L 850 454 L 970 454 L 970 498 L 1030 498" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="28" y="542" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">7. Bipolar AMI (สองขั้วสลับ)</text>
  <text x="28" y="561" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="normal" fill="#475569">0 = 0V, 1 = สลับ +V และ -V</text>
  <line x1="310" y1="546" x2="1030" y2="546" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 310 546 L 430 546 L 430 524 L 550 524 L 550 546 L 790 546 L 790 568 L 910 568 L 910 524 L 1030 524" fill="none" stroke="#dc2626" stroke-width="3"/>
</svg>