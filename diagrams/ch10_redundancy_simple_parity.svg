<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 422" width="100%" height="auto">
  <rect width="1080" height="422" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 10: แนวคิดบิตตรวจสอบ (Redundancy) และ Simple Parity Check (พาริตี้แบบง่าย)</text>
  <rect x="24" y="56" width="1032" height="166" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">1) แนวคิดบิตตรวจสอบ (Redundancy Concept — รูปที่ 10.3)</text>
  <rect x="44" y="106" width="186" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="137" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e3a8a">ฝั่งผู้ส่ง (Sender)</text>
  <text x="137" y="156" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">นำข้อมูลเข้าฟังก์ชัน</text>
  <text x="137" y="174" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">สร้างบิตตรวจสอบ</text>
  <line x1="232.0" y1="149.0" x2="278.0" y2="149.0" stroke="#2563eb" stroke-width="2.8"/>
  <polygon points="286.0,149.0 276.0,154.5 276.0,143.5" fill="#2563eb"/>
  <rect x="290" y="118" width="210" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="395" y="144" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#92400e">[ ข้อมูล | บิตตรวจสอบ ]</text>
  <text x="395" y="166" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#78350f">ส่งผ่านสื่อกลาง (Medium)</text>
  <line x1="502.0" y1="149.0" x2="548.0" y2="149.0" stroke="#2563eb" stroke-width="2.8"/>
  <polygon points="556.0,149.0 546.0,154.5 546.0,143.5" fill="#2563eb"/>
  <rect x="560" y="106" width="200" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="660" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#5b21b6">ฝั่งผู้รับ (Receiver)</text>
  <text x="660" y="156" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">คำนวณฟังก์ชันตรวจสอบ</text>
  <text x="660" y="174" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">เทียบกับบิตที่ส่งมา</text>
  <line x1="762.0" y1="128.0" x2="816.0" y2="128.0" stroke="#16a34a" stroke-width="2.8"/>
  <polygon points="824.0,128.0 814.0,133.5 814.0,122.5" fill="#16a34a"/>
  <rect x="828" y="106" width="208" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="932" y="131" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#14532d">ตรงกัน → ยอมรับ (Accept)</text>
  <line x1="762.0" y1="170.0" x2="816.0" y2="170.0" stroke="#dc2626" stroke-width="2.8"/>
  <polygon points="824.0,170.0 814.0,175.5 814.0,164.5" fill="#dc2626"/>
  <rect x="828" y="152" width="208" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="932" y="177" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.8" font-weight="bold" fill="#991b1b">ไม่ตรง → ปฏิเสธ (Reject)</text>
  <rect x="24" y="238" width="1032" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="266" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">2) Simple Parity Check (Even Parity: บังคับให้จำนวนเลข 1 ทั้งหมดเป็น 'เลขคู่')</text>
  <rect x="44" y="282" width="484" height="102" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="62" y="308" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#14532d">ตัวอย่าง Even Parity (ข้อมูล 7 บิต + บิตพาริตี้ 1 บิต):</text>
  <text x="62" y="336" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="12.6" font-weight="bold" fill="#0f172a">• ข้อมูล 1011000 (มีเลข 1 = 3 ตัว คี่) → เติม 1 → 10110001</text>
  <text x="62" y="364" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="12.6" font-weight="bold" fill="#0f172a">• ข้อมูล 1010000 (มีเลข 1 = 2 ตัว คู่) → เติม 0 → 10100000</text>
  <rect x="548" y="282" width="488" height="102" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="566" y="308" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#991b1b">ความสามารถและจุดอ่อนสำคัญ (ออกสอบบ่อยมาก!):</text>
  <text x="566" y="338" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#15803d">✓ ตรวจจับความผิดพลาดจำนวนเลขคี่ (1, 3, 5, ... บิต) ได้ 100%</text>
  <text x="566" y="366" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#dc2626">✗ ตรวจจับความผิดพลาดจำนวนเลขคู่ (2, 4, 6, ... บิต) ไม่ได้เลย!</text>
</svg>