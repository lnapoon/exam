<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 468" width="100%" height="auto">
  <rect width="1080" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 5.5 (กราฟ 4 มุมเฟส: 0°, 90°, 180°, 270°) และรูปที่ 5.7 (การรวมคลื่นสัญญาณ Composite Signal)</text>
  <rect x="24" y="56" width="1032" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">รูปที่ 5.5: เปรียบเทียบตำแหน่งเริ่มต้นของคลื่นไซน์ที่เวลา t = 0 ทั้ง 4 มุมเฟส (Phase: φ)</text>
  <rect x="44" y="98" width="236" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="162" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#2563eb">φ = 0° (0 rad)</text>
  <line x1="58" y1="164" x2="266" y2="164" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="58" y1="122" x2="58" y2="206" stroke="#64748b" stroke-width="1.8"/>
  <path d="M 58 164 C 82 114, 114 114, 138 164 C 162 214, 194 214, 218 164" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="162" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="bold" fill="#475569">เริ่มที่ 0 พุ่งขึ้น (+)</text>
  <rect x="296" y="98" width="236" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="414" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#7c3aed">φ = 90° (1/4 รอบ)</text>
  <line x1="310" y1="164" x2="518" y2="164" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="310" y1="122" x2="310" y2="206" stroke="#64748b" stroke-width="1.8"/>
  <path d="M 310 124 C 334 124, 346 204, 390 204 C 434 204, 446 124, 470 124" fill="none" stroke="#7c3aed" stroke-width="2.8"/>
  <text x="414" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="bold" fill="#475569">เริ่มที่ยอดบวกสูงสุด (+A)</text>
  <rect x="548" y="98" width="236" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="666" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#16a34a">φ = 180° (1/2 รอบ)</text>
  <line x1="562" y1="164" x2="770" y2="164" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="562" y1="122" x2="562" y2="206" stroke="#64748b" stroke-width="1.8"/>
  <path d="M 562 164 C 586 214, 618 214, 642 164 C 666 114, 698 114, 722 164" fill="none" stroke="#16a34a" stroke-width="2.8"/>
  <text x="666" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="bold" fill="#475569">เริ่มที่ 0 พุ่งลง (-)</text>
  <rect x="800" y="98" width="236" height="134" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="918" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#dc2626">φ = 270° (3/4 รอบ)</text>
  <line x1="814" y1="164" x2="1022" y2="164" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="814" y1="122" x2="814" y2="206" stroke="#64748b" stroke-width="1.8"/>
  <path d="M 814 204 C 838 204, 850 124, 894 124 C 938 124, 950 204, 974 204" fill="none" stroke="#dc2626" stroke-width="2.8"/>
  <text x="918" y="224" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.8" font-weight="bold" fill="#475569">เริ่มที่ยอดลบต่ำสุด (-A)</text>
  <rect x="24" y="262" width="1032" height="186" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="290" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">รูปที่ 5.7: การรวมคลื่นสัญญาณ (Composite Signal) — ส่งหลายความถี่ในช่องสัญญาณเดียวกัน</text>
  <rect x="44" y="306" width="210" height="124" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="149" y="328" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#1e3a8a">คลื่นที่ 1 (ความถี่ต่ำ f1)</text>
  <line x1="60" y1="376" x2="238" y2="376" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 60 376 Q 104 330 149 376 T 238 376" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <text x="274" y="376" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="24" font-weight="bold" fill="#0f172a">+</text>
  <rect x="294" y="306" width="210" height="124" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="399" y="328" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#5b21b6">คลื่นที่ 2 (ความถี่สูง f2)</text>
  <line x1="310" y1="376" x2="488" y2="376" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 310 376 Q 325 344 340 376 T 370 376 T 400 376 T 430 376 T 460 376 T 488 376" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <text x="524" y="376" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="24" font-weight="bold" fill="#0f172a">=</text>
  <rect x="544" y="306" width="240" height="124" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="664" y="328" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#92400e">คลื่นสัญญาณผสม (Time-Domain)</text>
  <line x1="560" y1="376" x2="768" y2="376" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 560 376 L 578 340 L 594 362 L 614 334 L 632 368 L 652 350 L 668 386 L 688 372 L 708 410 L 728 382 L 748 402 L 766 376" fill="none" stroke="#d97706" stroke-width="2.6"/>
  <line x1="788.0" y1="368.0" x2="814.0" y2="368.0" stroke="#16a34a" stroke-width="2.8"/>
  <polygon points="822.0,368.0 812.0,373.5 812.0,362.5" fill="#16a34a"/>
  <rect x="826" y="306" width="210" height="124" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="931" y="328" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#14532d">Frequency-Domain (2 แท่ง)</text>
  <line x1="846" y1="406" x2="1016" y2="406" stroke="#64748b" stroke-width="1.6"/>
  <line x1="888" y1="406" x2="888" y2="344" stroke="#2563eb" stroke-width="6"/>
  <line x1="964" y1="406" x2="964" y2="364" stroke="#7c3aed" stroke-width="6"/>
  <text x="888" y="422" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#1e3a8a">f1</text>
  <text x="964" y="422" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12" font-weight="bold" fill="#5b21b6">f2</text>
</svg>