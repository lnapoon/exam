<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 364" width="100%" height="auto">
  <rect width="1080" height="364" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">รูปที่ 5.1–5.2: เปรียบเทียบสัญญาณไม่ตามคาบ (Aperiodic), ตามคาบ (Periodic) และดิจิทัล (Digital)</text>
  <rect x="24" y="56" width="328" height="288" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="188" y="86" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#92400e">รูปที่ 5.1 (ก): สัญญาณไม่ตามคาบ (Aperiodic)</text>
  <rect x="42" y="102" width="292" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="56" y1="166" x2="320" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 56 166 Q 74 114 90 166 T 118 190 Q 134 128 152 166 T 186 144 Q 204 214 226 166 T 258 122 Q 282 186 318 152" fill="none" stroke="#d97706" stroke-width="2.8"/>
  <text x="44" y="254" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• รูปแบบไม่ซ้ำกัน ไม่สามารถคาดเดาล่วงหน้าได้</text>
  <text x="44" y="276" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• ตัวอย่าง: คลื่นเสียงพูดของมนุษย์ (Voice)</text>
  <rect x="376" y="56" width="328" height="288" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="540" y="86" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e3a8a">รูปที่ 5.1 (ข): สัญญาณตามคาบ (Periodic)</text>
  <rect x="394" y="102" width="292" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="408" y1="166" x2="672" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 408 166 Q 430 110 452 166 T 496 166 T 540 166 T 584 166 T 628 166 T 672 166" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="396" y="254" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• รูปแบบเกิดซ้ำเป็นรอบ ๆ คาดเดาล่วงหน้าได้</text>
  <text x="396" y="276" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• ตัวอย่าง: คลื่นไซน์ (Sine Wave)</text>
  <rect x="728" y="56" width="328" height="288" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="892" y="86" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#991b1b">รูปที่ 5.2: สัญญาณดิจิทัล (Square Wave)</text>
  <rect x="746" y="102" width="292" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="760" y1="196" x2="1024" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 760 196 L 798 196 L 798 134 L 842 134 L 842 196 L 882 196 L 882 134 L 966 134 L 966 196 L 1020 196" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="890" y="124" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.5" font-weight="bold" fill="#dc2626">0     1     0     1     1     0</text>
  <text x="748" y="254" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• สัญญาณไม่ต่อเนื่อง (Discrete) เป็นคลื่นสี่เหลี่ยม</text>
  <text x="748" y="276" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#1e293b">• แทนค่าแรงดันของบิต 0 และ 1 โดยตรง</text>
</svg>