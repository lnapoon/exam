  <rect x="664" y="104" width="372" height="166" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="682" y="128" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#14532d">ประโยชน์ 3 ประการของ WLAN:</text>
  <text x="682" y="152" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">1. ความคล่องตัว (Mobility):</text>
  <text x="682" y="173" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">เคลื่อนย้ายอุปกรณ์ทำงานในรัศมีสัญญาณได้อิสระ</text>
  <text x="682" y="194" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">2. ติดตั้งง่ายและรวดเร็วในพื้นที่ที่เดินสายเคเบิลลำบาก</text>
  <text x="682" y="215" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">(เช่น อาคารเก่า)</text>
  <text x="682" y="236" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">3. ขยายเครือข่ายและปรับผังสำนักงานได้ยืดหยุ่น</text>
  <rect x="664" y="282" width="372" height="144" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="682" y="306" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#991b1b">ข้อควรระวังสำคัญ (ออกสอบบ่อย!):</text>
  <text x="682" y="330" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">• ความปลอดภัย (Security):</text>
  <text x="682" y="351" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">สัญญาณวิทยุแพร่กระจายในอากาศ</text>
  <text x="682" y="372" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">ทำให้ผู้ไม่หวังดีดักจับข้อมูลได้ง่าย</text>
  <text x="682" y="393" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">จึงต้องเข้ารหัสสัญญาณและกำหนดสิทธิ์เข้าถึงเสมอ</text>
