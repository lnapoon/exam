  <text x="642" y="288" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.3" font-weight="normal" fill="#1e293b">• หากเกิดบิตเสีย 4 บิต พร้อมกันในตำแหน่ง 'มุมสี่เหลี่ยมผืนผ้า' (2</text>
  <text x="642" y="309" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.3" font-weight="normal" fill="#1e293b">แถว × 2 คอลัมน์ตรงกันพอดี)</text>
  <text x="642" y="330" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.3" font-weight="normal" fill="#1e293b">พาริตี้ทั้งแนวตั้งและแนวนอนจะไม่เปลี่ยน!</text>
