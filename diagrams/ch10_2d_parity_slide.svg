  <text x="642" y="156" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.3" font-weight="normal" fill="#1e293b">• ตรวจจับความผิดพลาด 1, 2 หรือ 3 บิตได้ 100%</text>
  <text x="642" y="177" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.3" font-weight="normal" fill="#1e293b">• แม้บิตในแถวเดียวกันเสีย 2 บิต (Row Parity จับไม่ได้) แต่</text>
