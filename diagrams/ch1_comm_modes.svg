<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 504" width="100%" height="auto">
  <rect width="1080" height="504" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 1: องค์ประกอบการสื่อสารข้อมูล 5 ส่วน และทิศทางการสื่อสาร 3 รูปแบบ</text>
  <rect x="24" y="56" width="1032" height="184" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="82" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">1) องค์ประกอบของการสื่อสารข้อมูล 5 อย่าง (Five Components of Data Communication)</text>
  <rect x="44" y="98" width="190" height="44" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="139" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#5b21b6">5. Protocol (กฎเกณฑ์)</text>
  <text x="139" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.5" font-weight="normal" fill="#64748b">Step 1, Step 2, ...</text>
  <rect x="846" y="98" width="190" height="44" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="941" y="118" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#5b21b6">5. Protocol (กฎเกณฑ์)</text>
  <text x="941" y="134" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.5" font-weight="normal" fill="#64748b">Step 1, Step 2, ...</text>
  <rect x="44" y="152" width="190" height="68" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="139" y="180" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#1e3a8a">2. ผู้ส่ง (Sender)</text>
  <text x="139" y="202" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">คอมพิวเตอร์ / โทรศัพท์</text>
  <rect x="846" y="152" width="190" height="68" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="941" y="180" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#14532d">3. ผู้รับ (Receiver)</text>
  <text x="941" y="202" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">คอมพิวเตอร์ / เครื่องพิมพ์</text>
  <rect x="390" y="100" width="300" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="540" y="122" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">1. ข่าวสาร (Message)</text>
  <text x="540" y="142" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#78350f">ข้อความ, ตัวเลข, รูปภาพ, เสียง, วิดีโอ</text>
  <line x1="238.0" y1="186.0" x2="832.0" y2="186.0" stroke="#2563eb" stroke-width="3"/>
  <polygon points="840.0,186.0 830.0,191.5 830.0,180.5" fill="#2563eb"/>
  <text x="540" y="212" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#1d4ed8">4. สื่อกลาง (Transmission Medium): สายคู่บิดเกลียว / สายไฟเบอร์ / คลื่นวิทยุ</text>
  <rect x="24" y="256" width="328" height="228" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="188" y="284" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">(ก) Simplex (สื่อสารทางเดียว)</text>
  <rect x="44" y="302" width="82" height="48" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="85" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">ผู้ส่ง</text>
  <rect x="250" y="302" width="82" height="48" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="291" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">ผู้รับ</text>
  <line x1="128.0" y1="326.0" x2="216.0" y2="326.0" stroke="#2563eb" stroke-width="3"/>
  <polygon points="224.0,326.0 214.0,331.5 214.0,320.5" fill="#2563eb"/>
  <text x="188" y="378" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">ส่งทางเดียวตลอดเวลา</text>
  <text x="46" y="404" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• อุปมา: ถนนเดินรถทางเดียว (One-way)</text>
  <text x="46" y="425" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ตัวอย่าง: คีย์บอร์ด → จอภาพ,</text>
  <text x="46" y="446" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">  วิทยุ/โทรทัศน์, หอกระจายข่าว</text>
  <rect x="376" y="256" width="328" height="228" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="540" y="284" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">(ข) Half-Duplex (สองทางครึ่งอัตรา)</text>
  <rect x="396" y="302" width="82" height="48" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="437" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">สถานี A</text>
  <rect x="602" y="302" width="82" height="48" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="643" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">สถานี B</text>
  <line x1="480.0" y1="314.0" x2="568.0" y2="314.0" stroke="#2563eb" stroke-width="2.8"/>
  <polygon points="576.0,314.0 566.0,319.5 566.0,308.5" fill="#2563eb"/>
  <line x1="576.0" y1="338.0" x2="488.0" y2="338.0" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="6,5"/>
  <polygon points="480.0,338.0 490.0,332.5 490.0,343.5" fill="#7c3aed"/>
  <text x="540" y="378" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">ส่งได้ 2 ทาง แต่สลับเวลากันส่ง</text>
  <text x="398" y="404" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• อุปมา: ถนนเลนเดียวที่รถต้องรอสวนกัน</text>
  <text x="398" y="425" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ตัวอย่าง: วิทยุสื่อสาร (Walkie-Talkie),</text>
  <text x="398" y="446" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">  วิทยุตำรวจ (ต้องกดพูดทีละฝ่าย)</text>
  <rect x="728" y="256" width="328" height="228" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="892" y="284" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">(ค) Full-Duplex (สองทางเต็มอัตรา)</text>
  <rect x="748" y="302" width="82" height="48" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="789" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">สถานี A</text>
  <rect x="954" y="302" width="82" height="48" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="995" y="331" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">สถานี B</text>
  <line x1="832.0" y1="314.0" x2="920.0" y2="314.0" stroke="#16a34a" stroke-width="2.8"/>
  <polygon points="928.0,314.0 918.0,319.5 918.0,308.5" fill="#16a34a"/>
  <line x1="928.0" y1="338.0" x2="840.0" y2="338.0" stroke="#16a34a" stroke-width="2.8"/>
  <polygon points="832.0,338.0 842.0,332.5 842.0,343.5" fill="#16a34a"/>
  <text x="892" y="378" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#0f172a">รับและส่งพร้อมกันในเวลาเดียวกัน</text>
  <text x="750" y="404" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• อุปมา: ถนน 2 เลนแยกทิศทางสวนกัน</text>
  <text x="750" y="425" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">• ตัวอย่าง: โทรศัพท์ (พูดและฟังพร้อมกัน)</text>
  <text x="750" y="446" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.5" font-weight="normal" fill="#334155">  และเครือข่าย Ethernet สมัยใหม่</text>
</svg>