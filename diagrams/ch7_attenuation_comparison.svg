<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 412" width="100%" height="auto">
  <rect width="1080" height="412" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 7: เปรียบเทียบประสิทธิภาพและการลดทอนสัญญาณ (Attenuation) ของสายทั้ง 3 ชนิด</text>
  <rect x="24" y="56" width="520" height="336" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="86" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">กราฟแนวโน้มการลดทอนสัญญาณ (dB/km) เทียบกับความถี่</text>
  <line x1="80" y1="328" x2="514" y2="328" stroke="#64748b" stroke-width="2"/>
  <line x1="80" y1="106" x2="80" y2="328" stroke="#64748b" stroke-width="2"/>
  <text x="297" y="356" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#475569">ความถี่ / อัตราข้อมูล (Frequency ↑)</text>
  <text x="48" y="218" transform="rotate(-90 48 218)" text-anchor="middle" font-family="Thonburi, sans-serif" font-size="12.5" font-weight="bold" fill="#475569">การลดทอน (dB/km ↑)</text>
  <path d="M 92 302 Q 168 232 238 118" fill="none" stroke="#dc2626" stroke-width="3.2"/>
  <text x="246" y="130" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#dc2626">UTP (ลดทอนพุ่งสูงเร็วสุด!)</text>
  <path d="M 92 310 Q 246 268 386 172" fill="none" stroke="#2563eb" stroke-width="3.2"/>
  <text x="394" y="178" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#2563eb">Coaxial</text>
  <path d="M 92 320 L 496 312" fill="none" stroke="#16a34a" stroke-width="3.2"/>
  <text x="290" y="302" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#16a34a">Fiber-Optic (ต่ำมากและคงที่!)</text>
  <rect x="564" y="56" width="492" height="336" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="584" y="86" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">จุดเน้นออกสอบเรื่องประสิทธิภาพและการลดทอน:</text>
  <rect x="584" y="104" width="452" height="82" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="602" y="128" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#991b1b">1. สาย UTP (Twisted-Pair):</text>
  <text x="602" y="150" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• ที่ความถี่ &gt; 100 kHz การลดทอนพุ่งสูงขึ้นอย่างรวดเร็ว</text>
  <text x="602" y="170" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• สายเส้นใหญ่ (18 AWG) ลดทอนน้อยกว่าสายเล็ก (26 AWG)</text>
  <rect x="584" y="198" width="452" height="82" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="602" y="222" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1e3a8a">2. สาย Coaxial:</text>
  <text x="602" y="244" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• แบนด์วิดท์สูงกว่า UTP แต่สัญญาณลดทอนเร็วที่ความถี่สูง</text>
  <text x="602" y="264" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• จำเป็นต้องติดตั้งตัวทวนสัญญาณ (Repeater) บ่อยกว่าไฟเบอร์</text>
  <rect x="584" y="292" width="452" height="82" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="602" y="316" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#14532d">3. สาย Fiber-Optic:</text>
  <text x="602" y="338" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">• การลดทอนต่ำกว่าสายทองแดงมหาศาล ใช้ Repeater น้อยมาก</text>
  <text x="602" y="358" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#334155">  (ไฟเบอร์ใช้ทุก ~50 กม. เทียบกับสายทองแดงที่ต้องใช้ทุก ~5 กม.)</text>
</svg>