<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 456" width="100%" height="auto">
  <rect width="1080" height="456" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 10: โครงสร้างตำแหน่งบิต Hamming Code (2^r ≥ m + r + 1) &amp; การแก้ Burst Error</text>
  <rect x="24" y="56" width="1032" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="44" y="84" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#1e40af">1) ตำแหน่งบิตของ Hamming Code (11, 7): ข้อมูล 7 บิต + บิตตรวจสอบ 4 บิต (วางที่ตำแหน่ง 2^n)</text>
  <rect x="44" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="85" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d11</text>
  <text x="85" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 11</text>
  <rect x="134" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="175" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d10</text>
  <text x="175" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 10</text>
  <rect x="224" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="265" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d9</text>
  <text x="265" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 9</text>
  <rect x="314" y="102" width="82" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="355" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#b91c1c">r8 (2^3)</text>
  <text x="355" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 8</text>
  <rect x="404" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="445" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d7</text>
  <text x="445" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 7</text>
  <rect x="494" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="535" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d6</text>
  <text x="535" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 6</text>
  <rect x="584" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="625" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d5</text>
  <text x="625" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 5</text>
  <rect x="674" y="102" width="82" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="715" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#b91c1c">r4 (2^2)</text>
  <text x="715" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 4</text>
  <rect x="764" y="102" width="82" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="805" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#1e3a8a">d3</text>
  <text x="805" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 3</text>
  <rect x="854" y="102" width="82" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="895" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#b91c1c">r2 (2^1)</text>
  <text x="895" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 2</text>
  <rect x="944" y="102" width="82" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="985" y="126" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="12.8" font-weight="bold" fill="#b91c1c">r1 (2^0)</text>
  <text x="985" y="148" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="11.2" font-weight="normal" fill="#475569">ตำแหน่ง 1</text>
  <text x="44" y="188" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">• r1 (ตำแหน่ง 1): คุมตำแหน่ง 1, 3, 5, 7, 9, 11    |    • r2 (ตำแหน่ง 2): คุมตำแหน่ง 2, 3, 6, 7, 10, 11</text>
  <text x="44" y="214" text-anchor="start" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">• r4 (ตำแหน่ง 4): คุมตำแหน่ง 4, 5, 6, 7           |    • r8 (ตำแหน่ง 8): คุมตำแหน่ง 8, 9, 10, 11</text>
  <text x="44" y="246" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13" font-weight="bold" fill="#1d4ed8">• สูตรหาจำนวนบิตตรวจสอบ: 2^r ≥ m + r + 1 (เช่น ข้อมูล m = 7 บิต → ใช้ r = 4 บิต เพราะ 2^4 = 16 ≥ 7 + 4 + 1 = 12)</text>
  <text x="44" y="270" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.2" font-weight="normal" fill="#475569">• Hamming Code 1 บล็อกแก้ไขความผิดพลาดได้ 1 บิต (Single-Bit Error Correction) โดยอ่านค่า Syndrome r8 r4 r2 r1</text>
  <rect x="24" y="302" width="1032" height="134" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="44" y="330" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14.5" font-weight="bold" fill="#5b21b6">2) การแก้ไขความผิดพลาดแบบหลายบิต (Burst Error Correction ด้วยการส่งแนวตั้ง / Interleaving)</text>
  <text x="44" y="358" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.6" font-weight="normal" fill="#1e293b">• นำข้อมูลหลายบล็อกที่ใส่บิต Hamming แล้ว มาเรียงซ้อนเป็นตารางแนวนอน (N แถว × M คอลัมน์) แต่เวลาส่งจริงให้ดึงบิตส่งออกใน 'แนวตั้งทีละคอลัมน์'</text>
  <text x="44" y="381" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.6" font-weight="normal" fill="#1e293b">• เมื่อเกิด Burst Error ระหว่างส่ง (บิตเสียติดกันหลายบิต) เมื่อฝั่งผู้รับเรียงกลับเป็นแถวตามเดิม บิตที่เสียจะกระจายแยกไปอยู่แถวละ 1 บิตเท่านั้น</text>
  <text x="44" y="404" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.6" font-weight="normal" fill="#1e293b">• ทำให้ Hamming Code ของแต่ละแถวสามารถแก้ไขความผิดพลาดบิตเดียวในแถวของตนเองได้ครบทุกแถว!</text>
</svg>