<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 432" width="100%" height="auto">
  <rect width="1080" height="432" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="38" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="19" font-weight="bold" fill="#0f172a">บทที่ 2: การส่งข้อมูลและแอดเดรสใน 3 เลเยอร์สำคัญ (MAC vs IP vs Port)</text>
  <rect x="24" y="56" width="1032" height="356" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="48" y="146" width="210" height="124" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="153" y="174" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#5b21b6">เครื่องต้นทาง (Host A)</text>
  <text x="153" y="200" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">Port: 49152</text>
  <text x="153" y="224" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#1d4ed8">IP: A (คงเดิมตลอดทาง)</text>
  <text x="153" y="248" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#15803d">MAC: 10</text>
  <rect x="412" y="158" width="256" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="540" y="186" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#92400e">Router (ทำงานเฉพาะชั้น 1–3)</text>
  <text x="540" y="214" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12.5" font-weight="bold" fill="#0f172a">ขาเข้า MAC: 20  |  ขาออก MAC: 33</text>
  <text x="540" y="238" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="normal" fill="#475569">อ่าน IP ปลายทางเพื่อเลือกเส้นทาง (Routing)</text>
  <rect x="822" y="146" width="210" height="124" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="927" y="174" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="14" font-weight="bold" fill="#5b21b6">เครื่องปลายทาง (Host B)</text>
  <text x="927" y="200" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#0f172a">Port: 80 (HTTP)</text>
  <text x="927" y="224" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#1d4ed8">IP: P (คงเดิมตลอดทาง)</text>
  <text x="927" y="248" text-anchor="middle" font-family='"Menlo", "Consolas", monospace' font-size="13" font-weight="bold" fill="#15803d">MAC: 95</text>
  <path d="M 153 142 Q 540 58 927 142" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="540" y="90" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#7c3aed">Transport Layer (L4): Process-to-Process Delivery (ใช้ Port Address ระบุโปรแกรม)</text>
  <line x1="260.0" y1="208.0" x2="402.0" y2="208.0" stroke="#16a34a" stroke-width="3"/>
  <polygon points="410.0,208.0 400.0,213.5 400.0,202.5" fill="#16a34a"/>
  <text x="335" y="196" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#15803d">Hop 1 (MAC: 10 → 20)</text>
  <line x1="670.0" y1="208.0" x2="812.0" y2="208.0" stroke="#16a34a" stroke-width="3"/>
  <polygon points="820.0,208.0 810.0,213.5 810.0,202.5" fill="#16a34a"/>
  <text x="745" y="196" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#15803d">Hop 2 (MAC: 33 → 95)</text>
  <path d="M 153 274 Q 540 344 927 274" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="540" y="336" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#1d4ed8">Network Layer (L3): Source-to-Destination Delivery (ใช้ Logical / IP Address: A → P คงเดิมตลอดเส้นทาง)</text>
  <text x="540" y="384" text-anchor="middle" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="13.5" font-weight="bold" fill="#15803d">Data Link Layer (L2): Hop-to-Hop Delivery — ค่า Physical Address (MAC) เปลี่ยนไปทุกช่วงที่ผ่าน Router!</text>
</svg>