  <polygon points="638.0,198.0 632.5,188.0 643.5,188.0" fill="#dc2626"/>
  <text x="650" y="183" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#dc2626">Interface</text>
  <line x1="958.0" y1="200.0" x2="958.0" y2="168.0" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="958.0,160.0 963.5,170.0 952.5,170.0" fill="#dc2626"/>
  <text x="946" y="183" text-anchor="end" font-family='"Thonburi", "Sarabun", -apple-system, sans-serif' font-size="12" font-weight="bold" fill="#dc2626">Interface</text>
  <rect x="566" y="260" width="464" height="154" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="584" y="284" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">จุดออกสอบสำคัญ:</text>
  <text x="584" y="304" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">• Peer-to-Peer Process: กระบวนการในเลเยอร์เดียวกันระหว่าง 2</text>
  <text x="584" y="324" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">เครื่อง ที่สื่อสารกันเสมือนคุยตรงด้วยโพรโตคอลเดียวกัน (ยกเว้นชั้น</text>
  <text x="584" y="344" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">Physical)</text>
  <text x="584" y="364" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">• Interface: ส่วนเชื่อมต่อระหว่างเลเยอร์ที่ติดกัน</text>
  <text x="584" y="384" text-anchor="start" font-family='"Thonburi", "Sarabun", -apple-system, BlinkMacSystemFont, sans-serif' font-size="12.2" font-weight="normal" fill="#1e293b">ช่วยให้พัฒนาหรือเปลี่ยนการทำงานภายในเลเยอร์หนึ่งได้โดยไม่กระทบชั้นอื่น</text>
</svg>